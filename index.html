<script>
/* ============================ TTS (PUHEGENERAATTORI) ============================ */
function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  let clean = text.replace(/<[^>]*>?/gm, '');
  clean = clean.replace(/&middot;/g, ' kertaa ').replace(/−/g, ' miinus ').replace(/\+/g, ' plus ').replace(/=/g, ' on ');
  let u = new SpeechSynthesisUtterance(clean);
  u.lang = 'fi-FI';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

/* ============================ MASCOT & UI ============================ */
function getRoboSVG(size = 80) {
  return `<svg class="robo-avatar bounce" width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="30" y="10" width="40" height="12" rx="4" fill="#0EA5E9"/>
    <circle cx="50" cy="8" r="5" fill="#FACC15"/>
    <rect x="20" y="24" width="60" height="46" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="38" cy="42" r="8" fill="#38BDF8"/>
    <circle cx="62" cy="42" r="8" fill="#38BDF8"/>
    <circle cx="38" cy="42" r="3" fill="#FFF"/>
    <circle cx="62" cy="42" r="3" fill="#FFF"/>
    <path d="M 38 58 Q 50 66 62 58" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="10" y="36" width="8" height="20" rx="3" fill="#38BDF8"/>
    <rect x="82" y="36" width="8" height="20" rx="3" fill="#38BDF8"/>
    <rect x="28" y="74" width="44" height="18" rx="6" fill="#334155" stroke="#38BDF8" stroke-width="3"/>

}

function mascot(msg) {
  const cleanMsg = msg ? msg.replace(/<[^>]*>?/gm, '').replace(/'/g, "\\'") : '';
  return `<div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0">
    ${getRoboSVG(70)}
    ${msg ? `<div id="mascot-bubble" style="display:flex;align-items:center;gap:10px;background:#1E293B;border:3px solid var(--neon-blue);box-shadow:var(--border-glow);border-radius:16px;padding:10px 14px;font-weight:600;color:var(--ink);max-width:420px;transition:all 0.3s">
      <span>${msg}</span>
      <button class="speak-btn" onclick="speakText('${cleanMsg}')" style="background:none;border:none;cursor:pointer;font-size:28px;padding:0;filter:drop-shadow(0 0 5px rgba(56,189,248,0.8));transition:transform 0.1s">🔊</button>
    </div>` : ''}
  </div>`;
}

function getCustomNumPadHTML(accentColor = "var(--neon-yellow)") {

      <div style="display:grid;grid-template-columns:repeat(5, 1fr);gap:8px;width:100%">
        ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="btn pad-num-btn tech-font" data-n="${n}" style="font-size:26px;padding:12px 0;background:#1E293B;border-color:var(--neon-blue)">${n}</button>`).join('')}
      </div>
      <div style="display:flex;gap:12px;width:100%;margin-top:2px">
        <button id="pad-clear" class="btn tech-font" style="flex:1;padding:12px;background:#E11D48;border-color:#9F1239;color:#fff;font-size:18px">Pyyhi ⌫</button>
        <button id="pad-submit" class="btn tech-font" style="flex:1.5;padding:12px;background:var(--neon-green);border-color:#15803D;color:#000;font-size:22px">OK ➔</button>
      </div>
    </div>
  `;
}

function bindNumPad(onSubmit) {
  let val = "";
  const display = document.getElementById("pad-display");
  const numBtns = document.querySelectorAll(".pad-num-btn");
  const clearBtn = document.getElementById("pad-clear");
  const submitBtn = document.getElementById("pad-submit");

  numBtns.forEach(b => {
    b.onclick = () => { if (val.length < 3) { val += b.dataset.n; if (display) display.textContent = val; } };
  });

  if (clearBtn) { clearBtn.onclick = () => { val = val.slice(0, -1); if (display) display.textContent = val; }; }
  if (submitBtn) { submitBtn.onclick = () => { if (val !== "") onSubmit(parseInt(val)); }; }
}

function bindGeoboard(targetEdges, onSubmit) {
  let edges = new Set();
  let active = null;
  const svg = document.getElementById("geo-user");
  const dots = svg.querySelectorAll('.geo-dot');
  const hits = svg.querySelectorAll('.geo-hit');
  const linesGroup = document.getElementById("geo-lines");
  
  function render() {
      linesGroup.innerHTML = '';
      edges.forEach(e => {
          let [a, b] = e.split('-').map(Number);
          let x1 = 20 + (a % 3) * 40; let y1 = 20 + Math.floor(a / 3) * 40;
          let x2 = 20 + (b % 3) * 40; let y2 = 20 + Math.floor(b / 3) * 40;
          linesGroup.innerHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--neon-yellow)" stroke-width="4" stroke-linecap="round"/>`;
      });
      dots.forEach((d, i) => {
          if (i === active) {
              d.setAttribute("fill", "var(--neon-pink)");
              d.setAttribute("r", "6");
              d.style.filter = "drop-shadow(0 0 6px var(--neon-pink))";
          } else {
              d.setAttribute("fill", "#64748B");
              d.setAttribute("r", "4");
              d.style.filter = "none";
          }
      });
  }

  hits.forEach(hit => {
      hit.onclick = () => {
          let i = parseInt(hit.dataset.i);
          if (active !== null && active !== i) {
              let edge = Math.min(active, i) + "-" + Math.max(active, i);
              if (edges.has(edge)) edges.delete(edge);
              else edges.add(edge);
              active = i;
          } else if (active === i) {
              active = null; 
          } else {
              active = i;
          }
          render();
      };
  });

  document.getElementById("geo-clear").onclick = () => { edges.clear(); active = null; render(); };
  document.getElementById("geo-submit").onclick = () => {
      let isCorrect = edges.size === targetEdges.length && targetEdges.every(e => edges.has(e));
      onSubmit(isCorrect);
  };
  render();
}

function bindDrawingCanvas(targetNum, showGuide, onSubmit) {
  const cvs = document.getElementById('draw-canvas');
  const ctx = cvs.getContext('2d');
  
  const CSIZE = 260; // Suurennettu piirtoalue
  const offCvs = document.createElement('canvas');
  offCvs.width = CSIZE; offCvs.height = CSIZE;
  const offCtx = offCvs.getContext('2d');

  // Käytetään erittäin selkeää perusfonttia numeroiden oppimiseen
  const clearFontStyle = "bold 200px Arial, Helvetica, sans-serif";

  offCtx.font = clearFontStyle;
  offCtx.textAlign = "center";
  offCtx.textBaseline = "middle";
  offCtx.fillStyle = "#FFFFFF";
  offCtx.fillText(targetNum, CSIZE/2, CSIZE/2 + 15);
  offCtx.strokeStyle = "#FFFFFF";
  offCtx.lineWidth = 35; 
  offCtx.strokeText(targetNum, CSIZE/2, CSIZE/2 + 15);

  const maskData = offCtx.getImageData(0,0,CSIZE,CSIZE).data;
  let maskPixels = 0;
  for (let i = 3; i < maskData.length; i += 4) {
     if (maskData[i] > 128) maskPixels++;
  }

  let strokes = [];
  let currentStroke = null;
  let drawing = false;

  function renderCanvas() {
    ctx.clearRect(0,0,CSIZE,CSIZE);
    if (showGuide) {
      ctx.font = clearFontStyle;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#334155";
      ctx.fillText(targetNum, CSIZE/2, CSIZE/2 + 15);
    }
    
    // SUORA VÄRIKOODI (Cyan/Blue), jotta piirtojälki ei muutu mustaksi selaimen oletuksena
    ctx.strokeStyle = "#38BDF8"; 
    ctx.lineWidth = 20;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    strokes.forEach(stroke => {
       if(stroke.length === 0) return;
       ctx.beginPath();
       ctx.moveTo(stroke[0].x, stroke[0].y);
       for(let i=1; i<stroke.length; i++) {
         ctx.lineTo(stroke[i].x, stroke[i].y);
       }
       ctx.stroke();
    });
  }

  function getPos(e) {
    const rect = cvs.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (CSIZE / rect.width),
      y: (clientY - rect.top) * (CSIZE / rect.height)
    };
  }

  function start(e) { e.preventDefault(); drawing = true; currentStroke = [getPos(e)]; strokes.push(currentStroke); renderCanvas(); }
  function move(e) { e.preventDefault(); if(!drawing) return; currentStroke.push(getPos(e)); renderCanvas(); }
  function end(e) { drawing = false; }

  cvs.addEventListener('mousedown', start);
  cvs.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cvs.addEventListener('touchstart', start, {passive:false});
  cvs.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', end);

  activeGameCleanup = () => {
     window.removeEventListener('mouseup', end);
     window.removeEventListener('touchend', end);
  };

  renderCanvas();

  document.getElementById('draw-clear').onclick = () => { strokes = []; renderCanvas(); };

  document.getElementById('draw-submit').onclick = () => {
     if (strokes.length === 0) { onSubmit(false); return; }

     let minX = CSIZE, minY = CSIZE, maxX = 0, maxY = 0;
     strokes.forEach(stroke => stroke.forEach(p => {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
     }));

     let w = maxX - minX;
     let h = maxY - minY;
     if (w < 5 && h < 5) { onSubmit(false); return; } 

     let cx = minX + w/2;
     let cy = minY + h/2;

     const tempCvs = document.createElement('canvas');
     tempCvs.width = CSIZE; tempCvs.height = CSIZE;
     const tempCtx = tempCvs.getContext('2d');

     tempCtx.strokeStyle = "#FFFFFF";
     tempCtx.lineWidth = 40; 
     tempCtx.lineCap = "round"; tempCtx.lineJoin = "round";

     let scale = 1;
     if (h > 10) scale = 160 / h;
     if (scale > 2.5) scale = 2.5;
     if (scale < 0.6) scale = 0.6;

     tempCtx.translate(CSIZE/2, CSIZE/2 + 15);
     tempCtx.scale(scale, scale);
     tempCtx.translate(-cx, -cy);

     strokes.forEach(stroke => {
       tempCtx.beginPath(); tempCtx.moveTo(stroke[0].x, stroke[0].y);
       for(let i=1; i<stroke.length; i++) tempCtx.lineTo(stroke[i].x, stroke[i].y);
       tempCtx.stroke();
     });

     const userData = tempCtx.getImageData(0,0,CSIZE,CSIZE).data;
     let hitCount = 0;
     let userPixels = 0;

     for (let i = 3; i < userData.length; i += 4) {
        if (userData[i] > 128) {
           userPixels++;
           if (maskData[i] > 128) hitCount++;
        }
     }

     let coverage = hitCount / maskPixels;
     let precision = hitCount / userPixels;
     
     let isCorrect = (coverage > 0.35 && precision > 0.3);
     onSubmit(isCorrect);
  };
}

/* ============================ AUDIO & STORAGE ============================ */
let _ctx = null;
function ac() { try { if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)(); if (_ctx.state === "suspended") _ctx.resume(); return _ctx; } catch (e) { return null; } }
function tone(fStart, fEnd, startTime, duration, type = "sine", gainVal = 0.15) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), ga = c.createGain();
  o.type = type; o.frequency.setValueAtTime(fStart, c.currentTime + startTime);
  if (fEnd) o.frequency.exponentialRampToValueAtTime(Math.max(fEnd, 10), c.currentTime + startTime + duration);
  ga.gain.setValueAtTime(1e-4, c.currentTime + startTime); ga.gain.exponentialRampToValueAtTime(gainVal, c.currentTime + startTime + 0.02); ga.gain.exponentialRampToValueAtTime(1e-4, c.currentTime + startTime + duration);
  o.connect(ga); ga.connect(c.destination);
  o.start(c.currentTime + startTime); o.stop(c.currentTime + startTime + duration + 0.03);
}
function playCorrect() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => tone(f, f * 1.02, i * 0.06, 0.12, "triangle", 0.18)); }
function playTry() { tone(260, 110, 0, 0.25, "sawtooth", 0.15); }
function playStar() { tone(1318.51, 1318.51, 0, 0.08, "square", 0.12); tone(1760.00, 1760.00, 0.08, 0.25, "square", 0.15); }

const PKEY = "robomath_progress";
let prog = load(PKEY, { stars: 0, completions: { 1: 0, 2: 0, 3: 0 } });
if (!prog.completions) prog.completions = { 1: 0, 2: 0, 3: 0 }; 

function load(k, def) { try { return { ...def, ...JSON.parse(localStorage.getItem(k) || "{}") }; } catch (e) { return { ...def }; } }
function saveProg() { localStorage.setItem(PKEY, JSON.stringify(prog)); }
function addStars(n) { prog.stars += n; saveProg(); renderHeader(); }

/* ============================ STATE & NAVIGATION ============================ */
const S = { screen: "menu", grade: null, category: null, difficulty: null, specificTable: null, roundStars: 0, totalRounds: 10, newMedal: null };
const root = document.getElementById("root");

let activeGameCleanup = null;
let activeTimeouts = [];

function cleanupGame() {
  activeTimeouts.forEach(t => clearTimeout(t)); activeTimeouts = [];
  if (typeof activeGameCleanup === "function") { activeGameCleanup(); activeGameCleanup = null; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

function safeSetTimeout(fn, delay) {
  const t = setTimeout(() => { activeTimeouts = activeTimeouts.filter(item => item !== t); fn(); }, delay);
  activeTimeouts.push(t);
}

function go(screen) { cleanupGame(); S.screen = screen; render(); }
function selectGrade(g) { S.grade = g; go("categories"); }
function selectCategory(cat) { S.category = cat; S.specificTable = null; go("difficulties"); }
function selectDifficulty(diff) { S.difficulty = diff; S.specificTable = null; S.roundStars = 0; go("game"); }
function handleBack() {
  if (S.screen === "categories") go("menu");
  else if (S.screen === "difficulties") go("categories");
  else if (S.screen === "game") go("difficulties");
  else if (S.screen === "complete") go("difficulties");

}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============================ PRO GAME ENGINE ============================ */
function runGame(m, generateFn) {
  const level = S.difficulty.id;
  const TOTAL_ROUNDS = 10;
  S.totalRounds = TOTAL_ROUNDS;
  let currentRound = 0, targetVal = null;

  function nextQuestion() {
    cleanupGame();
    if (currentRound >= TOTAL_ROUNDS) { 
      activeGameCleanup = null; 
      let passed = S.roundStars >= 5; 
      S.newMedal = null;
      if (passed) {
        prog.completions[level] = (prog.completions[level] || 0) + 1;
        let c = prog.completions[level];
        if (level >= 1 && level <= 3) {
          if (c === 5) S.newMedal = "Pronssimitali 🥉";
          if (c === 10) S.newMedal = "Hopeamitali 🥈";
          if (c === 15) S.newMedal = "Kultamitali 🥇";
        }
        saveProg();
      }
      go("complete"); 
      return; 
    }
    
    const q = generateFn(currentRound, level);
    targetVal = q.targetVal;

    let answerControlsHTML = '';
    if (q.isInputMode) {
      answerControlsHTML = getCustomNumPadHTML(q.accentColor || "var(--neon-blue)");
    } else if (q.isDrawingMode || q.isGeoboard) {
      answerControlsHTML = q.customOptionsHTML;
    } else {
      if (q.customOptionsHTML) {
        answerControlsHTML = q.customOptionsHTML;
      } else {
        answerControlsHTML = `<div id="options-grid" class="grid" style="grid-template-columns:repeat(${q.opts.length <= 4 ? 2 : 3}, 1fr);max-width:340px;margin-top:10px">
          ${q.opts.map(opt => `<button class="btn opt-btn tech-font" data-val="${opt}" style="font-size:${q.opts.length>4?'22px':'28px'};padding:16px">${opt}</button>`).join('')}
        </div>`;
      }
    }

    let wrapStyle = q.isDrawingMode 
       ? `margin-top:8px; display:flex; flex-direction:column; align-items:center; width:100%; max-width:340px;` 
       : `background:var(--panel);border:3px solid ${q.accentColor || 'var(--neon-blue)'};border-radius:24px;padding:${q.padding || '20px'};display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;min-width:280px;width:100%;max-width:340px`;

    m.innerHTML = `<div class="fade" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
      ${mascot(q.instructionText)}
      <div style="display:flex;align-items:center;gap:16px">
        <div class="tech-font" style="color:${q.accentColor || 'var(--neon-blue)'};font-weight:700">Tehtävä ${currentRound + 1} / ${TOTAL_ROUNDS}</div>
      </div>
      <div style="${wrapStyle}" id="scanner-box">
        ${q.displayHTML}
      </div>
      ${answerControlsHTML}
    </div>`;
    
    speakText(q.instructionText);

    if (q.isInputMode) {
      bindNumPad((val) => { cleanupGame(); checkAnswer(val, document.getElementById("pad-display")); });
    } else if (q.isGeoboard) {
      bindGeoboard(q.targetEdges, (isCorrect) => {
        cleanupGame(); 
        checkAnswer(isCorrect ? q.targetVal : false, document.getElementById("geo-submit"));
      });
    } else if (q.isDrawingMode) {
      bindDrawingCanvas(q.targetNum, q.showGuide, (isCorrect) => {
        cleanupGame();
        checkAnswer(isCorrect ? q.targetVal : false, document.getElementById("draw-submit"));
      });
    } else {
      m.querySelectorAll('.opt-btn').forEach(b => {
        b.onclick = () => {
          cleanupGame();
          let val = b.dataset.val;
          if (!isNaN(val) && typeof targetVal === 'number') val = parseInt(val);
          checkAnswer(val, b);
        };
      });
    }
  }

  function checkAnswer(val, targetElement) {
    const ctrls = document.getElementById('options-grid') || document.getElementById('numpad-container');
    if (ctrls) ctrls.classList.add('no-clicks');

    if (val === targetVal) {
      playCorrect(); playStar();
      S.roundStars++; addStars(1);
      targetElement.classList.add('correct-btn');
      safeSetTimeout(() => { currentRound++; nextQuestion(); }, 1500);
    } else {
      playTry();
      targetElement.classList.add('shake', 'wrong-btn');
      
      const mb = document.getElementById('mascot-bubble');
      if (mb) { 
        if (typeof val === "boolean") { 
           mb.innerHTML = `Hups! Muoto ei ollut aivan oikein. Yritä huolellisemmin!`;
        } else {
           mb.innerHTML = `Hups! Oikea vastaus: <b style="color:var(--neon-yellow)">${targetVal}</b>`; 
        }
        mb.style.borderColor = "var(--neon-pink)"; 
      }
      
      if (document.getElementById('pad-display')) {
        targetElement.innerHTML = `<s style="opacity:0.6">${val}</s> <b style="color:#FFF">${targetVal}</b>`;
      }
      
      m.querySelectorAll('.opt-btn').forEach(b => {
        let v = b.dataset.val; if (!isNaN(v) && typeof targetVal === 'number') v = parseInt(v);
        if (v === targetVal) b.classList.add('correct-btn');
      });
      safeSetTimeout(() => { currentRound++; nextQuestion(); }, 2500);
    }
  }
  nextQuestion();
}

function renderG2KelloGame(m) {
  runGame(m, (round, level) => {
    let h = Math.floor(Math.random() * 12) + 1; let min = 0;
    if (level === 1) min = Math.random() < 0.5 ? 0 : 30; else min = [0, 15, 30, 45][Math.floor(Math.random() * 4)];
    const isHard = (level === 3); const forwardMins = isHard ? [15, 30][Math.floor(Math.random() * 2)] : 0;
    const radM = (min * 6 - 90) * (Math.PI / 180); const radH = ((h % 12) * 30 + min * 0.5 - 90) * (Math.PI / 180);
    const mx = 50 + 35 * Math.cos(radM); const my = 50 + 35 * Math.sin(radM); const hx = 50 + 22 * Math.cos(radH); const hy = 50 + 22 * Math.sin(radH);
    let totalMins = min + forwardMins; let targetH = h; if (totalMins >= 60) { totalMins -= 60; targetH = h === 12 ? 1 : h + 1; }
    const timeStr = `${targetH}.${totalMins === 0 ? '00' : (totalMins < 10 ? '0'+totalMins : totalMins)}`;
    let instr = isHard ? `Mitä kello on <b>${forwardMins} minuutin</b> kuluttua?` : "Paljonko kello on?";

        <div id="options-grid" style="display:flex; gap:12px; width:100%; max-width:340px; margin-top:10px;">
          <button id="draw-clear" class="btn tech-font" style="flex:1; padding:12px; background:#E11D48; border-color:#9F1239; color:#fff; font-size:18px;">Pyyhi ⌫</button>
          <button id="draw-submit" class="btn tech-font" style="flex:1.5; padding:12px; background:var(--neon-green); border-color:#15803D; color:#000; font-size:22px;">Valmis ➔</button>
        </div>
      `,
      accentColor: "transparent"
    };
  });
}

/* ============================ TULOSRUUTU & PALAUTE ============================ */
function renderComplete(m) {
  let score = S.roundStars; const maxStars = S.totalRounds || 10;
  let title = "", text = "", emoji = "", color = "";
  if (score <= 4) { title = "Harjoitus tekee mestarin!"; text = "Ei hätää, kokeile uudelleen niin opit tämän varmasti!"; emoji = "💪"; color = "var(--neon-pink)"; } 
  else if (score <= 7) { title = "Jes! Tehtävä suoritettu!"; text = "Hienoa työtä! Kokeile uudelleen, niin voit saada vielä enemmän tähtiä."; emoji = "👍"; color = "var(--neon-blue)"; } 
  else { title = "Loistavaa!"; text = "Olet todellinen matikkanero!"; emoji = "🏆"; color = "var(--neon-green)"; }
  let medalHTML = S.newMedal ? `<div class="bounce" style="background:#4ADE80;color:#000;padding:12px 24px;border-radius:16px;font-weight:700;margin-top:12px;border:3px solid #FFF">Uusi tarra ansaittu: ${S.newMedal}! Katso Tarrakirjasta!</div>` : '';

  m.innerHTML = `<div class="fade" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="font-size:72px">${emoji}</div>
    <h2 class="tech-font" style="font-size:32px;color:${color};margin:0">${title}</h2>
    <p style="font-size:18px;color:#94A3B8;margin:0;max-width:320px">${text}</p>
    <div style="background:var(--panel);border:3px solid ${color};border-radius:24px;padding:20px;margin-top:10px;width:100%;max-width:320px">
      <p style="font-size:18px;color:#FFF;margin:0">Sait tästä osiosta <br><strong style="color:var(--neon-yellow);font-size:36px" class="tech-font">${score} / ${maxStars}</strong> tähteä!</p>
    </div>
    ${medalHTML}
    <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:16px">
      <button id="again" class="btn tech-font" style="padding:14px 24px;font-size:18px;background:var(--neon-blue);color:#000">Pelaa uudelleen ➔</button>
      <button id="todiff" class="btn tech-font" style="padding:14px 24px;font-size:18px">Vaihda vaikeustasoa</button>
      <button id="tostickers" class="btn tech-font" style="padding:14px 24px;font-size:18px;background:#312E81;border-color:var(--neon-purple);color:var(--neon-yellow)">🏆 Tarrakirja</button>
    </div>
  </div>`;
  document.getElementById("again").onclick = () => { S.roundStars = 0; go("game"); }; document.getElementById("todiff").onclick = () => go("difficulties"); document.getElementById("tostickers").onclick = () => go("stickers");
}

/* ============================ TARRAKIRJA ============================ */
function renderStickers(m) {
  const getMedal = (diff, req, icon, name) => {
    const isUnlocked = prog.completions[diff] >= req;
    return `<div style="display:flex;flex-direction:column;align-items:center;padding:12px;background:#1E293B;border-radius:12px;border:2px solid ${isUnlocked ? 'var(--neon-yellow)' : '#334155'};opacity:${isUnlocked ? 1 : 0.4};filter:${isUnlocked ? 'none' : 'grayscale(1)'}"><div style="font-size:42px">${icon}</div><div class="tech-font" style="font-size:12px;margin-top:8px;text-align:center">${name}</div><div style="font-size:11px;color:#94A3B8;margin-top:4px">${prog.completions[diff]}/${req} läpäisyä</div></div>`;
  };
  const starStickers = [ { req: 10, icon: "🎈", name: "Ilmapallo" }, { req: 25, icon: "🌈", name: "Sateenkaari" }, { req: 50, icon: "🦄", name: "Yksisarvinen" }, { req: 100, icon: "🚀", name: "Raketti" }, { req: 200, icon: "🐉", name: "Lohikäärme" }, { req: 500, icon: "👑", name: "Kruunu" } ];
  const getStarSticker = (s) => {
    const isUnlocked = prog.stars >= s.req;
    return `<div style="display:flex;flex-direction:column;align-items:center;padding:12px;background:#1E293B;border-radius:12px;border:2px solid ${isUnlocked ? 'var(--neon-purple)' : '#334155'};opacity:${isUnlocked ? 1 : 0.4};filter:${isUnlocked ? 'none' : 'grayscale(1)'}"><div style="font-size:42px">${s.icon}</div><div class="tech-font" style="font-size:12px;margin-top:8px;text-align:center">${s.name}</div><div style="font-size:11px;color:#94A3B8;margin-top:4px">${prog.stars}/${s.req} ⭐</div></div>`;
  };
  m.innerHTML = `<div class="fade" style="width:100%;max-width:760px">${mascot("Tervetuloa Tarrakirjaan! Kerää tähtiä ja läpäise tasoja (vähintään 5/10 oikein) avataksesi uusia tarroja.")}<h3 class="tech-font" style="color:var(--neon-yellow);margin-top:24px;border-bottom:2px solid #334155;padding-bottom:8px">Mitalit (Helppo taso)</h3><div class="grid" style="grid-template-columns:repeat(3, 1fr);gap:12px">${getMedal(1, 5, '🥉', 'Pronssi')}${getMedal(1, 10, '🥈', 'Hopea')}${getMedal(1, 15, '🥇', 'Kulta')}</div><h3 class="tech-font" style="color:var(--neon-yellow);margin-top:24px;border-bottom:2px solid #334155;padding-bottom:8px">Mitalit (Keskitaso)</h3><div class="grid" style="grid-template-columns:repeat(3, 1fr);gap:12px">${getMedal(2, 5, '🥉', 'Pronssi')}${getMedal(2, 10, '🥈', 'Hopea')}${getMedal(2, 15, '🥇', 'Kulta')}</div><h3 class="tech-font" style="color:var(--neon-yellow);margin-top:24px;border-bottom:2px solid #334155;padding-bottom:8px">Mitalit (Haastava taso)</h3><div class="grid" style="grid-template-columns:repeat(3, 1fr);gap:12px">${getMedal(3, 5, '🥉', 'Pronssi')}${getMedal(3, 10, '🥈', 'Hopea')}${getMedal(3, 15, '🥇', 'Kulta')}</div><h3 class="tech-font" style="color:var(--neon-purple);margin-top:32px;border-bottom:2px solid #334155;padding-bottom:8px">Tähtitarrat</h3><div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));gap:12px">${starStickers.map(s => getStarSticker(s)).join('')}</div></div>`;
}

/* START */
render();
</script>
</body>
</html>
